
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Agendamento - Minimercado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bg-success text-white text-center p-3">
        <h1>Cadastro e Agendamento</h1>
        <nav class="nav justify-content-center">
            <a class="nav-link text-white" href="index.html">Página Inicial</a>
        </nav>
    </header>

    <main class="container mt-5">
        <form id="formCadastro">
            <h2 class="mb-4">Cadastro do Cliente</h2>
            <div class="mb-3">
                <label for="nome" class="form-label">Nome completo:</label>
                <input type="text" class="form-control" id="nome" placeholder="Digite seu nome completo" required>
            </div>
            <div class="mb-3">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email" class="form-control" id="email" placeholder="email@exemplo.com" required>
            </div>
            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone:</label>
                <input type="tel" class="form-control" id="telefone" placeholder="(00) 00000-0000" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Sexo:</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="sexo" id="sexoM" value="Masculino" required>
                    <label class="form-check-label" for="sexoM">Masculino</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="sexo" id="sexoF" value="Feminino">
                    <label class="form-check-label" for="sexoF">Feminino</label>
                </div>
            </div>
            <div class="mb-3">
                <label for="endereco" class="form-label">Endereço:</label>
                <input type="text" class="form-control" id="endereco" placeholder="Rua, número, bairro, cidade" required>
            </div>

            <h3 class="mt-4 mb-3">Agendamento</h3>
            <div class="mb-3">
                <label for="tipoServico" class="form-label">Tipo de Serviço:</label>
                <select class="form-select" id="tipoServico" required>
                    <option value="">Selecione</option>
                    <option value="Retirada no local">Retirada no local</option>
                    <option value="Tele-entrega">Tele-entrega</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="data" class="form-label">Data da entrega/retirada:</label>
                <input type="date" class="form-control" id="data" required>
            </div>
            <div class="mb-3">
                <label for="hora" class="form-label">Hora da entrega/retirada:</label>
                <input type="time" class="form-control" id="hora" required>
            </div>

            <button type="submit" class="btn btn-success mt-3">Confirmar Cadastro e Agendamento</button>
        </form>
    </main>

    <footer class="bg-dark text-white text-center p-4 mt-5">
        <p>&copy; 2025 Minimercado Orgânico & Natural - Todos os direitos reservados</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
